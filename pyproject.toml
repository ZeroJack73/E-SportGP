[project]
name = "sportpg"
version = "1.0.0"
description = "E-commerce de artículos deportivos SportPG (Django)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=6.1,<6.2",
    "pillow>=12",
    "dj-database-url>=3",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "django-storages[s3]>=1.14",
    "python-dotenv>=1.0",
]

# Vercel: paso extra de build (migraciones, administrador, datos de ejemplo, estaticos)
[tool.vercel.scripts]
build = "python build.py"
