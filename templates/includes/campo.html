<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
  <div class="input-group has-validation">
    <span class="input-group-text"><i class="bi {{ icono }}"></i></span>
    {{ field }}
    {% for error in field.errors %}
      <div class="invalid-feedback"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    {% endfor %}
  </div>
  {% if field.help_text %}<div class="form-text"><i class="bi bi-info-circle me-1"></i>{{ field.help_text|safe }}</div>{% endif %}
</div>
